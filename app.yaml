# Google Cloud Run Configuration
runtime: python311

# Configuración de la aplicación
env_variables:
  FLASK_ENV: production
  PORT: 8080

# Configuración de recursos (aumentados para Ollama + API)
resources:
  cpu: 4
  memory: 8Gi
  # Nota: Para GPU, necesitarás configurarlo desde la consola de Google Cloud
  # o usar gcloud CLI con --accelerator

# Configuración de escalado
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6

# Health check
liveness_check:
  path: "/health"
  initial_delay_seconds: 300
  timeout_seconds: 4
  period_seconds: 240
  failure_threshold: 4
  success_threshold: 2

# Configuración de red
vpc_access_connector:
  name: projects/PROJECT_ID/locations/REGION/connectors/CONNECTOR_NAME
