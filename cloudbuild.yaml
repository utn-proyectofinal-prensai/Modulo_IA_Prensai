# Cloud Build configuration para GitHub + Cloud Run
steps:
  # Paso 1: Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/prensai-api:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/prensai-api:latest',
      '.'
    ]

  # Paso 2: Subir la imagen a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/prensai-api:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/prensai-api:latest']

  # Paso 3: Deployar a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'prensai-api',
      '--image', 'gcr.io/$PROJECT_ID/prensai-api:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '12Gi',
      '--cpu', '2',
      '--gpu', '1',
      '--gpu-type', 'nvidia-l4',
      '--port', '8080',
      '--timeout', '900',
      '--cpu-boost',
      '--min-instances', '0',
      '--max-instances', '3',
      '--set-env-vars', 'FLASK_ENV=production'
    ]

# Configurar service account para el deployment
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/cloud-build-deployer@$PROJECT_ID.iam.gserviceaccount.com'

# Configuración de Cloud Build
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

# Variables de entorno disponibles
substitutions:
  _SERVICE_NAME: 'prensai-api'
  _REGION: 'us-central1'
